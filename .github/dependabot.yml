version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint supports TypeScript <6.1; remove once it supports 7.x
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    assignees:
      - 'wezzcoetzee'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    assignees:
      - 'wezzcoetzee'
